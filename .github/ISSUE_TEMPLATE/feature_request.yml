name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and why the current behavior falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: How you imagine it working. References to similar features in other apps are welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Notes, Tabs / search, Graph, Tasks, Whiteboards, Requests, Code, Welcome / settings, Other]
  - type: checkboxes
    id: local
    attributes:
      label: Local-first
      options:
        - label: This works without an account, a cloud service or telemetry.
